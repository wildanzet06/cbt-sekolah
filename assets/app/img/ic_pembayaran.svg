  <circle cx="80" cy="84" r="8.5" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".9"/>
  <circle cx="46" cy="72" r="3" fill="#60a5fa"/>
  <circle cx="114" cy="96" r="3" fill="#60a5fa"/>
